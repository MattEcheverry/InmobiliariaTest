<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Búsqueda de Inmuebles | Grupo Versa</title>
  <link rel="stylesheet" href="./styles.css?v=99">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body data-page="search">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <header class="site-header">
    <div class="container header-shell">
      <nav class="nav-left" aria-label="Principal">
        <a href="./search.html?op=arriendo">Arriendos</a>
        <a href="./search.html?op=venta">Ventas</a>
        <a href="./index.html#consigne">Consigne</a>
        <a href="./index.html#services">Servicios</a>
      </nav>
      <a class="brand-center" href="./index.html" aria-label="Grupo Versa">
        <picture>
          <source srcset="./assets/logo.svg" type="image/svg+xml">
          <img src="./assets/logo.png" alt="Grupo Versa" class="brand-logo">
        </picture>
      </a>
      <div class="nav-right">
        <div class="menu-dropdown" data-dropdown>
          <button class="btn btn-ghost dropdown-toggle" type="button" aria-expanded="false">Zona clientes</button>
          <div class="dropdown-menu">
            <a href="./clients.html">Portal de clientes</a>
            <a href="./clients.html#arrendatarios">Arrendatarios</a>
            <a href="./clients.html#propietarios">Propietarios</a>
          </div>
        </div>
        <a class="btn btn-primary" href="https://wa.me/573022584900" target="_blank" rel="noopener">WhatsApp</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuOpen" aria-label="Abrir menú" type="button">☰</button>
    </div>
  </header>

  <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>Menú</strong>
      <button class="mobile-menu-btn" id="mobileMenuClose" aria-label="Cerrar menú" type="button">✕</button>
    </div>
    <a href="./search.html?op=arriendo">Arriendos</a>
    <a href="./search.html?op=venta">Ventas</a>
    <a href="./clients.html">Zona clientes</a>
    <a class="btn btn-primary full" href="https://wa.me/573022584900" target="_blank" rel="noopener">WhatsApp</a>
  </aside>

  <main id="main-content" class="section">
    <div class="container search-layout">
      <section class="search-results-col" id="resultsPanel">
        <div class="search-toolbar">
          <div class="segmented-control">
            <button type="button" class="segmented-btn is-active" data-op="arriendo">Arriendo</button>
            <button type="button" class="segmented-btn" data-op="venta">Venta</button>
          </div>
          <input id="searchBarrio" list="barriosListSearch" placeholder="Barrio o sector">
          <datalist id="barriosListSearch"></datalist>
          <select id="searchTipo">
            <option value="">Tipo</option>
            <option>Apartamento</option>
            <option>Casa</option>
            <option>Local</option>
            <option>Oficina</option>
            <option>Bodega</option>
          </select>
          <input id="searchMin" type="number" placeholder="Precio min">
          <input id="searchMax" type="number" placeholder="Precio max">
          <select id="searchHab">
            <option value="">Habitaciones</option>
            <option value="1">1+</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
          <button id="searchApplyBtn" class="btn btn-secondary" type="button">Aplicar</button>
        </div>
        <p id="searchCounter" class="muted">0 resultados en Cali</p>
        <div id="searchResultsList" class="result-list"></div>
      </section>

      <aside class="search-map-col" id="mapPanel">
        <div id="searchMap" class="leaflet-map" aria-label="Mapa de inmuebles"></div>
      </aside>
    </div>
  </main>

  <div class="mobile-map-toggle">
    <button id="showListBtn" class="btn btn-secondary is-active" type="button">Lista</button>
    <button id="showMapBtn" class="btn btn-secondary" type="button">Mapa</button>
  </div>

  <div class="toast" id="appToast" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./data.js?v=99"></script>
  <script src="./app.js?v=99"></script>
</body>
</html>
